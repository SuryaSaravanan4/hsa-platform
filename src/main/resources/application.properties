# ---- Datasource ----
quarkus.datasource.db-kind=mysql
# Dev + test: no URL set, so Quarkus Dev Services starts a throwaway MySQL container (needs Docker).
quarkus.datasource.devservices.image-name=mysql:8.4
# Prod (java -jar target/quarkus-app/quarkus-run.jar): points at the docker-compose MySQL.
%prod.quarkus.datasource.jdbc.url=${HSA_DB_URL:jdbc:mysql://localhost:3306/hsa}
%prod.quarkus.datasource.username=${HSA_DB_USER:hsa}
%prod.quarkus.datasource.password=${HSA_DB_PASSWORD:hsa}

# ---- Schema: Flyway owns it, Hibernate never generates DDL ----
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.jdbc.timezone=UTC

# Pool must be at least as big as the concurrency test fan-out (20 requests).
quarkus.datasource.jdbc.max-size=30
